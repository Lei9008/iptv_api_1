name: 1.Daily Update

on:
  schedule:
    - cron: '00 01 */2 * *'  # 每天凌晨01点分执行任务（上海时间：9:00）
  workflow_dispatch:  # 允许手动触发工作流


jobs:
  run_script:
    runs-on: ubuntu-latest  # 使用最新的Ubuntu运行器

    steps:
    - name: Checkout repository  # 检出代码库
      uses: actions/checkout@v3

    - name: Set up Python  # 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'  # 使用Python 3.10

    - name: Cache dependencies  # 缓存pip依赖项
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies  # 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies  # 安装Python依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests aiohttp

    - name: Run Python script  # 执行主脚本
      run: |
        python self_use/IPTV/main.py

    - name: Commit and push if changed  # 如果有更改，则提交并推送
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -A
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update live files"
          git pull --rebase
          git push
        fi

    - name: 清理旧的Workflow运行记录
      if: always()
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        keep_minimum_runs: 5  # 保留最近3条运行记录
        retain_days: 0       # 保留3天（即不按天数保留，仅按最小运行记录数保留）
        ignore_error: true    # 忽略清理错误
